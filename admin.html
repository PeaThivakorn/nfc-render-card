<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการร้าน (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light p-3">

<div class="container" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛠️ จัดการข้อมูลร้าน</h2>
        <a href="pos.html" class="btn btn-outline-primary">ไปหน้า POS</a>
    </div>

    <ul class="nav nav-tabs mb-3" id="adminTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#menu-tab">จัดการเมนู</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#table-tab">จัดการโต๊ะ</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#history-tab">ประวัติการขาย</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="menu-tab">
            <div class="card mb-4">
                <div class="card-body">
                    <form id="menuForm">
                        <input type="hidden" id="editId">
                        <div class="row g-2">
                            <div class="col-md-5"><input type="text" class="form-control" id="menuName" placeholder="ชื่อเมนู" required></div>
                            <div class="col-md-3"><input type="number" class="form-control" id="menuPrice" placeholder="ราคา" required></div>
                            <div class="col-md-2">
                                <select class="form-select" id="menuStatus"><option value="available">ขาย</option><option value="soldout">หมด</option></select>
                            </div>
                            <div class="col-md-2"><button type="submit" class="btn btn-success w-100" id="saveBtn">บันทึก</button></div>
                        </div>
                    </form>
                </div>
            </div>
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-light"><tr><th>เมนู</th><th>ราคา</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
                <tbody id="menuTableBody"></tbody>
            </table>
        </div>

        <div class="tab-pane fade" id="table-tab">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="input-group">
                        <input type="text" class="form-control" id="newTableName" placeholder="ชื่อโต๊ะ (เช่น Table 1)">
                        <button class="btn btn-primary" onclick="addTable()">เพิ่มโต๊ะ</button>
                    </div>
                </div>
            </div>
            <div class="row" id="adminTableList"></div>
        </div>

        <div class="tab-pane fade" id="history-tab">
            <button class="btn btn-sm btn-danger mb-3" onclick="clearHistory()">ล้างประวัติ</button>
            <table class="table table-striped bg-white">
                <thead><tr><th>เวลา</th><th>โต๊ะ</th><th>ยอดรวม</th></tr></thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCFShJHMyBdibWqtC9C-7UECOe49CRXUr4",
        authDomain: "khao-man-gai.firebaseapp.com",
        projectId: "khao-man-gai",
        storageBucket: "khao-man-gai.firebasestorage.app",
        messagingSenderId: "395966701230",
        appId: "1:395966701230:web:b570681a143e658934d73f",
        measurementId: "G-3PVW3CCT8C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // MENU LOGIC
    const menuForm = document.getElementById('menuForm');
    const menuTableBody = document.getElementById('menuTableBody');
    let isEditing = false;

    onSnapshot(collection(db, "menus"), (snapshot) => {
        menuTableBody.innerHTML = '';
        snapshot.forEach(docSnap => {
            const m = docSnap.data();
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${m.name}</td>
                <td>${m.price}</td>
                <td><span class="badge ${m.status==='available'?'bg-success':'bg-danger'}">${m.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="window.editMenu('${docSnap.id}', '${m.name}', '${m.price}', '${m.status}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-danger" onclick="window.deleteMenu('${docSnap.id}')"><i class="fas fa-trash"></i></button>
                </td>
            `;
            menuTableBody.appendChild(tr);
        });
    });

    menuForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const name = document.getElementById('menuName').value;
        const price = Number(document.getElementById('menuPrice').value);
        const status = document.getElementById('menuStatus').value;

        if(isEditing && id) {
            await updateDoc(doc(db, "menus", id), { name, price, status });
        } else {
            await addDoc(collection(db, "menus"), { name, price, status });
        }
        menuForm.reset(); isEditing = false;
        document.getElementById('saveBtn').innerText = 'บันทึก';
        document.getElementById('saveBtn').classList.replace('btn-warning', 'btn-success');
    });

    window.editMenu = (id, name, price, status) => {
        document.getElementById('editId').value = id;
        document.getElementById('menuName').value = name;
        document.getElementById('menuPrice').value = price;
        document.getElementById('menuStatus').value = status;
        document.getElementById('saveBtn').innerText = 'แก้ไข';
        document.getElementById('saveBtn').classList.replace('btn-success', 'btn-warning');
        isEditing = true;
    };
    window.deleteMenu = async (id) => {
        if(confirm('ลบเมนูนี้?')) await deleteDoc(doc(db, "menus", id));
    };

    // TABLE LOGIC
    const adminTableList = document.getElementById('adminTableList');
    onSnapshot(collection(db, "tables"), (snapshot) => {
        adminTableList.innerHTML = '';
        snapshot.forEach(docSnap => {
            const t = docSnap.data();
            adminTableList.innerHTML += `
                <div class="col-md-3 mb-3">
                    <div class="card shadow-sm text-center p-3">
                        <h5>${docSnap.id}</h5>
                        <span class="badge ${t.status==='open'?'bg-success':'bg-secondary'} mb-2">${t.status}</span>
                        <button class="btn btn-sm btn-danger" onclick="window.deleteTable('${docSnap.id}')">ลบ</button>
                    </div>
                </div>`;
        });
    });

    window.addTable = async () => {
        const name = document.getElementById('newTableName').value;
        if(!name) return Swal.fire('ใส่ชื่อโต๊ะ');
        await setDoc(doc(db, "tables", name), { status: 'closed', sessionId: '', requestBill: false });
        document.getElementById('newTableName').value = '';
    };
    window.deleteTable = async (id) => { if(confirm('ลบโต๊ะ?')) await deleteDoc(doc(db, "tables", id)); };

    // HISTORY LOGIC
    const historyTableBody = document.getElementById('historyTableBody');
    const qHistory = query(collection(db, "history"), orderBy("timestamp", "desc"));
    onSnapshot(qHistory, (snapshot) => {
        historyTableBody.innerHTML = '';
        snapshot.forEach(docSnap => {
            const h = docSnap.data();
            const date = new Date(h.timestamp).toLocaleString('th-TH');
            historyTableBody.innerHTML += `<tr><td><small>${date}</small></td><td>${h.tableName}</td><td><strong>${h.total}</strong></td></tr>`;
        });
    });
    window.clearHistory = async () => {
         if(confirm('ล้างประวัติทั้งหมด?')) {
             const snap = await getDocs(collection(db, "history"));
             snap.forEach(d => deleteDoc(d.ref));
         }
    };
</script>
</body>
</html>
