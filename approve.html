<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - ร้านข้าวมันไก่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .floating-cart { position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: #ff5722; color: white; padding: 15px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-light pb-5">

<div class="container mt-3">
    <h4 id="tableHeader">👋 ยินดีต้อนรับ</h4>
    <hr>
    
    <div id="menu-container" class="row">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div><br>กำลังโหลดเมนู...</div>
    </div>

    <div class="mt-5 mb-5">
        <h5>📋 รายการที่สั่ง (อัปเดตทันที)</h5>
        <div id="order-status-container" class="list-group">
            <div class="text-muted text-center">ยังไม่ได้สั่งอาหาร</div>
        </div>
        <button class="btn btn-outline-danger w-100 mt-3" onclick="requestBill()">เรียกเก็บเงิน / Check Bill</button>
    </div>
</div>

<div class="floating-cart" onclick="showCart()">
    <i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span>
</div>

<div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">ตะกร้าของคุณ</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul id="cartList" class="list-group mb-3"></ul>
                <div class="d-flex justify-content-between">
                    <strong>รวม</strong>
                    <strong id="cartTotal">0</strong>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="clearCart()">ล้างตะกร้า</button>
                <button type="button" class="btn btn-primary" onclick="confirmOrder()">ยืนยันการสั่ง</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, onSnapshot, query, where, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔥 Config ของคุณใส่ให้แล้วครับ
    const firebaseConfig = {
        apiKey: "AIzaSyCFShJHMyBdibWqtC9C-7UECOe49CRXUr4",
        authDomain: "khao-man-gai.firebaseapp.com",
        projectId: "khao-man-gai",
        storageBucket: "khao-man-gai.firebasestorage.app",
        messagingSenderId: "395966701230",
        appId: "1:395966701230:web:b570681a143e658934d73f",
        measurementId: "G-3PVW3CCT8C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('id');
    const tableName = urlParams.get('table');

    let cart = JSON.parse(localStorage.getItem('cart_' + sessionId)) || [];
    let menuData = [];

    // --- Functions (Exposed to Window) ---
    window.showCart = () => { updateCartModal(); new bootstrap.Modal(document.getElementById('cartModal')).show(); };
    window.clearCart = () => { cart = []; saveCart(); bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide(); };
    
    window.addToCart = (id) => { 
        const item = menuData.find(m => m.id === id);
        const exist = cart.find(c => c.id === id);
        if(exist) exist.qty++; else cart.push({...item, qty:1});
        saveCart();
        const toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1000 });
        toast.fire({ icon: 'success', title: 'เพิ่มลงตะกร้าแล้ว' });
    };
    
    window.removeFromCart = (index) => {
        cart.splice(index, 1);
        saveCart();
        updateCartModal();
    };

    window.confirmOrder = async () => {
        if(cart.length === 0) return;
        const modal = bootstrap.Modal.getInstance(document.getElementById('cartModal'));
        modal.hide();
        Swal.fire({title:'กำลังส่งออเดอร์...', didOpen:()=>Swal.showLoading()});

        try {
            const batchPromises = cart.map(item => {
                return addDoc(collection(db, "orders"), {
                    sessionId: sessionId,
                    tableName: tableName,
                    menuName: item.name,
                    qty: item.qty,
                    price: item.price,
                    status: 'รอทำ',
                    timestamp: new Date().toISOString()
                });
            });

            await Promise.all(batchPromises);
            
            cart = []; 
            saveCart();
            Swal.fire('สำเร็จ', 'ส่งออเดอร์เรียบร้อยแล้ว', 'success');
        } catch(err) {
            Swal.fire('ผิดพลาด', 'ส่งข้อมูลไม่สำเร็จ: ' + err.message, 'error');
        }
    };

    window.requestBill = () => {
        Swal.fire('แจ้งพนักงานแล้ว', 'กรุณารอสักครู่ พนักงานกำลังมาที่โต๊ะ', 'info');
    };

    function saveCart() { 
        localStorage.setItem('cart_' + sessionId, JSON.stringify(cart)); 
        document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+i.qty,0); 
    }
    
    function updateCartModal() {
        const list = document.getElementById('cartList'); list.innerHTML=''; let total=0;
        cart.forEach((i,idx) => { 
            total += (i.price * i.qty); 
            list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>${i.name} <small class="text-muted">x${i.qty}</small></div>
                    <div>
                        <span class="me-2">${i.price * i.qty}</span>
                        <button class="btn btn-sm text-danger" onclick="removeFromCart(${idx})"><i class="fas fa-times"></i></button>
                    </div>
                </li>`; 
        });
        document.getElementById('cartTotal').innerText = total + ' บาท';
    }

    // --- Main Logic ---
    (async () => {
        if(!sessionId) {
            Swal.fire({icon:'error', title:'ไม่พบ Session', text:'กรุณาสแกน QR Code ใหม่'});
            return;
        }
        document.getElementById('tableHeader').innerText = `👋 ${tableName || 'ลูกค้า'}`;
        saveCart();

        // 1. ตรวจสอบว่าโต๊ะปิดหรือยัง (Realtime Check)
        // ถ้า status != open ให้เด้งเตือน
        if (tableName) {
            const docRef = doc(db, "tables", tableName);
            onSnapshot(docRef, (docSnap) => {
                const data = docSnap.data();
                if (!data || data.status !== 'open' || data.sessionId !== sessionId) {
                    Swal.fire({
                        icon: 'error', 
                        title: 'QR Code หมดอายุ', 
                        text: 'โต๊ะนี้ถูกปิดแล้ว หรือ QR Code ไม่ถูกต้อง',
                        allowOutsideClick: false,
                        showConfirmButton: false
                    });
                    document.body.innerHTML = '<div class="container text-center mt-5"><h3>⛔ QR Code หมดอายุ</h3></div>';
                }
            });
        }

        // 2. โหลดเมนูจาก Firebase (Menus Collection)
        const container = document.getElementById('menu-container');
        try {
            const menuSnap = await getDocs(collection(db, "menus"));
            
            if (menuSnap.empty) {
                container.innerHTML = '<div class="text-center text-danger">ไม่พบเมนูอาหาร (กรุณาสร้าง Collection "menus" ใน Database)</div>';
            } else {
                container.innerHTML = '';
                menuSnap.forEach(doc => {
                    const m = doc.data();
                    if(m.status === 'available') {
                        menuData.push({id: doc.id, ...m});
                        container.innerHTML += `
                            <div class="col-6 col-md-4 mb-3">
                                <div class="card h-100 shadow-sm border-0">
                                    <div class="card-body p-3 text-center">
                                        <h6 class="card-title fw-bold">${m.name}</h6>
                                        <p class="text-success mb-2">${m.price}.-</p>
                                        <button class="btn btn-sm btn-outline-primary w-100 rounded-pill" onclick="addToCart('${doc.id}')">
                                            <i class="fas fa-plus"></i> ใส่ตะกร้า
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });
            }
        } catch (err) {
            container.innerHTML = `<div class="text-center text-danger">Error Load Menu: ${err.message}</div>`;
        }

        // 3. ฟังสถานะออเดอร์ของตัวเอง (Realtime)
        const q = query(collection(db, "orders"), where("sessionId", "==", sessionId), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('order-status-container');
            list.innerHTML = '';
            
            if(snapshot.empty) {
                list.innerHTML = '<div class="text-muted text-center py-3">ยังไม่ได้สั่งอาหาร</div>';
                return;
            }

            snapshot.forEach(doc => {
                const o = doc.data();
                let badge = 'bg-secondary';
                if(o.status==='กำลังทำ') badge='bg-warning text-dark';
                if(o.status==='เสิร์ฟแล้ว') badge='bg-success';
                
                list.innerHTML += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold">${o.menuName}</span> 
                            <small class="text-muted">x${o.qty}</small>
                        </div>
                        <span class="badge ${badge}">${o.status}</span>
                    </div>`;
            });
        });
    })();
</script>
</body>
</html>
